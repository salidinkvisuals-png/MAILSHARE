# fly.toml app configuration file generated for mailshare on 2026-05-17T21:35:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mailshare'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8001'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
